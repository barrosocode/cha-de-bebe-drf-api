components:
    schemas:
        AgeEnum:
            enum:
                - adult
                - kid
            type: string
            description: |-
                * `adult` - Adult
                * `kid` - Kid
        CategoryEnum:
            enum:
                - family
                - friend
                - church
            type: string
            description: |-
                * `family` - Family
                * `friend` - Friend
                * `church` - Church
        File:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                image:
                    type: string
                    format: uri
                    nullable: true
                image_url:
                    type: string
                    nullable: true
                    readOnly: true
                alt:
                    type: string
                    maxLength: 255
                gift:
                    type: string
                    format: uuid
            required:
                - gift
                - image_url
                - uuid
        Gift:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 100
                description:
                    type: string
                link:
                    type: string
                    format: uri
                    maxLength: 200
                limit:
                    type: integer
                    maximum: 9223372036854775807
                    minimum: 0
                    format: int64
                tag_names:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                    writeOnly: true
                    description: Lista de nomes de tags. Serão criadas automaticamente se não
                        existirem.
                tags:
                    type: array
                    items:
                        $ref: "#/components/schemas/Tag"
                    readOnly: true
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/File"
                    readOnly: true
            required:
                - files
                - limit
                - link
                - name
                - tags
                - uuid
        GiftPurchase:
            type: object
            description: Confirma a compra de um presente a partir do código do convite.
            properties:
                code:
                    type: string
                    maxLength: 6
                guest:
                    type: string
                    format: uuid
                message:
                    type: string
                    default: ""
            required:
                - code
                - guest
        GiftPurchaseGuest:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                name:
                    type: string
            required:
                - name
                - uuid
        GiftPurchaseResponse:
            type: object
            properties:
                message:
                    type: string
                guest:
                    $ref: "#/components/schemas/GiftPurchaseGuest"
                gift_message:
                    type: string
                selected_at:
                    type: string
                    format: date-time
            required:
                - gift_message
                - guest
                - message
                - selected_at
        Guest:
            type: object
            description: |-
                Serializer de Guest.

                Input (criação/atualização):
                {
                    "name": "Gabriel",
                    "age": "adult",
                    "category": "family",
                    "phone": "(11) 9 9999-9999",
                    "invite": "uuid-do-invite",
                    "gifts": [
                        {"gift": "uuid-do-gift", "message": "Parabéns!"},
                        {"gift": "uuid-do-outro-gift"}
                    ]
                }

                Output (leitura):
                {
                    "uuid": "guest-123...",
                    "name": "Gabriel",
                    "age": "adult",
                    "category": "family",
                    "phone": "(11) 9 9999-9999",
                    "confirmed": false,
                    "invite": "uuid-do-invite",
                    "gifts": [
                        {
                            "gift": {"uuid": "...", "name": "Carrinho", ...},
                            "message": "Parabéns!",
                            "selected_at": "2026-11-01T10:30:00Z"
                        }
                    ]
                }
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 255
                age:
                    $ref: "#/components/schemas/AgeEnum"
                phone:
                    type: string
                    nullable: true
                    maxLength: 20
                confirmed:
                    type: boolean
                    readOnly: true
                category:
                    $ref: "#/components/schemas/CategoryEnum"
                invite:
                    type: string
                    format: uuid
                gifts:
                    type: array
                    items:
                        type: object
                        additionalProperties: {}
                    writeOnly: true
                    description: "Lista de gifts escolhidos: [{'gift': uuid, 'message':
                        string}]"
            required:
                - age
                - category
                - confirmed
                - invite
                - name
                - uuid
        ConfirmGuestsRequest:
            type: object
            description: Corpo de POST /api/invites/{code}/confirm_guests/.
            properties:
                guest_uuids:
                    type: array
                    items:
                        type: string
                        format: uuid
            required:
                - guest_uuids
        ConfirmGuestsResponse:
            type: object
            description: Resposta de POST /api/invites/{code}/confirm_guests/.
            properties:
                message:
                    type: string
                confirmed_count:
                    type: integer
                guests:
                    type: array
                    items:
                        $ref: "#/components/schemas/PublicGuest"
            required:
                - confirmed_count
                - guests
                - message
        InviteCodeSummary:
            type: object
            properties:
                name:
                    type: string
                code:
                    type: string
            required:
                - code
                - name
        InviteGuestsResponse:
            type: object
            description: Resposta de GET /api/invites/{code}/guests/.
            properties:
                invite:
                    $ref: "#/components/schemas/InviteCodeSummary"
                guests:
                    type: array
                    items:
                        $ref: "#/components/schemas/PublicGuest"
            required:
                - guests
                - invite
        PublicGuest:
            type: object
            description: Nome do convidado exposto a quem informa o código do convite.
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    readOnly: true
                confirmed:
                    type: boolean
                    readOnly: true
            required:
                - confirmed
                - name
                - uuid
        Invite:
            type: object
            description: |-
                Serializer de Invite.

                O campo 'code' é gerado automaticamente pelo model, então é read_only.
                O usuário só precisa enviar o 'name' na criação.
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 255
                code:
                    type: string
                    readOnly: true
            required:
                - code
                - name
                - uuid
        Login:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                    writeOnly: true
            required:
                - password
                - username
        LoginResponse:
            type: object
            properties:
                token:
                    type: string
                    readOnly: true
                user:
                    allOf:
                        - $ref: "#/components/schemas/User"
                    readOnly: true
            required:
                - token
                - user
        LogoutResponse:
            type: object
            properties:
                message:
                    type: string
                    readOnly: true
            required:
                - message
        PatchedFile:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                image:
                    type: string
                    format: uri
                    nullable: true
                image_url:
                    type: string
                    nullable: true
                    readOnly: true
                alt:
                    type: string
                    maxLength: 255
                gift:
                    type: string
                    format: uuid
        PatchedGift:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 100
                description:
                    type: string
                link:
                    type: string
                    format: uri
                    maxLength: 200
                limit:
                    type: integer
                    maximum: 9223372036854775807
                    minimum: 0
                    format: int64
                tag_names:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                    writeOnly: true
                    description: Lista de nomes de tags. Serão criadas automaticamente se não
                        existirem.
                tags:
                    type: array
                    items:
                        $ref: "#/components/schemas/Tag"
                    readOnly: true
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/File"
                    readOnly: true
        PatchedGuest:
            type: object
            description: |-
                Serializer de Guest.

                Input (criação/atualização):
                {
                    "name": "Gabriel",
                    "age": "adult",
                    "category": "family",
                    "phone": "(11) 9 9999-9999",
                    "invite": "uuid-do-invite",
                    "gifts": [
                        {"gift": "uuid-do-gift", "message": "Parabéns!"},
                        {"gift": "uuid-do-outro-gift"}
                    ]
                }

                Output (leitura):
                {
                    "uuid": "guest-123...",
                    "name": "Gabriel",
                    "age": "adult",
                    "category": "family",
                    "phone": "(11) 9 9999-9999",
                    "confirmed": false,
                    "invite": "uuid-do-invite",
                    "gifts": [
                        {
                            "gift": {"uuid": "...", "name": "Carrinho", ...},
                            "message": "Parabéns!",
                            "selected_at": "2026-11-01T10:30:00Z"
                        }
                    ]
                }
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 255
                age:
                    $ref: "#/components/schemas/AgeEnum"
                phone:
                    type: string
                    nullable: true
                    maxLength: 20
                confirmed:
                    type: boolean
                    readOnly: true
                category:
                    $ref: "#/components/schemas/CategoryEnum"
                invite:
                    type: string
                    format: uuid
                gifts:
                    type: array
                    items:
                        type: object
                        additionalProperties: {}
                    writeOnly: true
                    description: "Lista de gifts escolhidos: [{'gift': uuid, 'message':
                        string}]"
        PatchedInvite:
            type: object
            description: |-
                Serializer de Invite.

                O campo 'code' é gerado automaticamente pelo model, então é read_only.
                O usuário só precisa enviar o 'name' na criação.
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 255
                code:
                    type: string
                    readOnly: true
        PatchedTag:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 100
                description:
                    type: string
        Tag:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                    maxLength: 100
                description:
                    type: string
            required:
                - name
                - uuid
        User:
            type: object
            properties:
                id:
                    type: integer
                    readOnly: true
                username:
                    type: string
                    description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
                        only.
                    pattern: ^[\w.@+-]+$
                    maxLength: 150
                first_name:
                    type: string
                    maxLength: 150
            required:
                - id
                - username
    securitySchemes:
        tokenAuth:
            type: apiKey
            in: header
            name: Authorization
            description: Token-based authentication with required prefix "Token"
