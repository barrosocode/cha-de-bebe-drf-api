    /api/invites/{code}/confirm_guests/:
        post:
            operationId: invites_confirm_guests_create
            description: |-
                Confirma a presença de convidados de um invite, sem login.

                URL: POST /api/invites/{code}/confirm_guests/
                Body: {"guest_uuids": ["uuid-1", "uuid-2"]}

                A resposta devolve os nomes dos convidados daquele convite.
                Para listar os nomes antes de confirmar, use GET /api/invites/{code}/guests/.
            parameters:
                - in: path
                  name: code
                  schema:
                      type: string
                      pattern: ^[A-Za-z0-9]{6}$
                  required: true
            tags:
                - invites
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConfirmGuestsRequest"
                    application/x-www-form-urlencoded:
                        schema:
